[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spatialharness"]

[project]
name = "spatialharness"
version = "0.2.0"
authors = [
  { name = "Shiqi Wang", email = "qtec@outlook.com" },
]
description = "A lightweight plugin-based toolkit for GIS and urban science: core does plugin management and data contracts only, all functionality ships as plugins."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = []
keywords = ["GIS", "urban-science", "plugin", "accessibility", "street-view"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
access = ["SpatialAccessibility"]
street = ["StreetSolarTrack"]
all = ["SpatialAccessibility", "StreetSolarTrack"]
dev = ["pytest"]

[project.scripts]
spatialharness = "spatialharness.cli:main"

[project.urls]
Homepage = "https://github.com/GIStudio/SpatialUtils"
Issues = "https://github.com/GIStudio/SpatialUtils/issues"
